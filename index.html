const PAGE = 80;
let shown = PAGE, sortKey = null, sortDir = 1;
const pref = s => (s.match(/^[A-Z]*/) || [''])[0] || '无字头';

// 填充字头筛选
const ofs = [...new Set(DATA.map(d => pref(d.old)))].sort();
const nfs = [...new Set(DATA.map(d => pref(d.new)))].sort();
of.insertAdjacentHTML('beforeend', ofs.map(v => `<option value="${v}">旧：${v === '无字头' ? '纯数字' : v + ' 字头'}</option>`).join(''));
nf.insertAdjacentHTML('beforeend', nfs.map(v => `<option value="${v}">新：${v === '无字头' ? '纯数字' : v + ' 字头'}</option>`).join(''));

const qEl = document.getElementById('q');
const tb = document.getElementById('tb');

function match(d, kw) {
  if (!kw) return true;
  const k = kw.trim().toUpperCase();
  return d.old.toUpperCase().includes(k) || d.new.toUpperCase().includes(k)
      || d.from.includes(kw) || d.to.includes(kw);
}

function render() {
  const kw = qEl.value.trim();
  let list = DATA.filter(d => match(d, kw)
    && (!of.value || pref(d.old) === of.value)
    && (!nf.value || pref(d.new) === nf.value));

  if (sortKey) {
    list = list.slice().sort((a, b) => {
      const va = sortKey === 'route' ? a.from + a.to : a[sortKey];
      const vb = sortKey === 'route' ? b.from + b.to : b[sortKey];
      return va.localeCompare(vb, 'zh') * sortDir;
    });
  }

  stats.innerHTML =
    `<span>共 <b>${list.length}</b> 条匹配${kw || of.value || nf.value ? `（全表 ${DATA.length} 条）` : ''}</span>` +
    `<span>变号 <b>${list.filter(d => d.old !== d.new).length}</b></span>` +
    `<span>未变号 <b>${list.filter(d => d.old === d.new).length}</b></span>`;

  const slice = list.slice(0, shown);
  const hl = (s) => kw ? s.replace(new RegExp('(' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>') : s;

  tb.innerHTML = slice.map(d => `<tr>
      <td class="code">${hl(d.old)}</td>
      <td class="route">${hl(d.from)}<span class="arrow">→</span>${hl(d.to)}</td>
      <td class="code ${d.old === d.new ? 'same' : 'new'}">${hl(d.new)}</td>
    </tr>`).join('');

  empty.style.display = list.length ? 'none' : 'block';
  more.style.display = list.length > shown ? 'block' : 'none';
  moreBtn.textContent = `显示更多（还有 ${list.length - shown} 条）`;
}

qEl.addEventListener('input', () => { shown = PAGE; render(); });
of.addEventListener('change', () => { shown = PAGE; render(); });
nf.addEventListener('change', () => { shown = PAGE; render(); });
moreBtn.addEventListener('click', () => { shown += PAGE * 2; render(); });
document.querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
  const k = th.dataset.k;
  sortDir = sortKey === k ? -sortDir : 1;
  sortKey = k;
  render();
}));
document.getElementById('total').textContent = DATA.length;
render();
</script>
